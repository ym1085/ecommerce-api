name: "✨ Feature"
description: "New feature request issue template"
labels: ["feature"]
body:
  - type: textarea
    attributes:
      label: 📄 Description
      description: Please describe the new feature.
      placeholder: The more detail, the better.
    validations:
      required: true

  - type: textarea
    id: tasks
    attributes:
      label: ✅ Tasks
      description: Write tasks using GitHub task list syntax (- [ ]).
      placeholder: |
        - [ ] 설계 확정
        - [ ] API 구현
        - [ ] 테스트 작성
        - [ ] 배포/릴리즈 노트
    validations:
      required: true

  - type: textarea
    attributes:
      label: 🙋🏻 References
      description: Add any relevant links or reference materials.
