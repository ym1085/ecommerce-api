name: "✨ Feature"
description: "New feature request issue template"
labels: ["feature"]
body:
  - type: textarea
    attributes:
      label: 📄 Description
      description: Please describe the new feature.
      placeholder: The more detail, the better.
    validations:
      required: true

  - type: textarea
    attributes:
      label: ✅ Tasks
      description: List the work items as a checkbox list.
      placeholder: Break it down into small, actionable tasks.
    validations:
      required: true

  - type: textarea
    attributes:
      label: 🙋🏻 References
      description: Add any relevant links or reference materials.
