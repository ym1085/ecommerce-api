bootJar.enabled = false // 실행 가능한 JAR 생성 비활성화
jar.enabled = true // JAR 생성 활성화

dependencies {
    // QueryDSL (Spring Boot 3.x = jakarta)
    implementation 'com.querydsl:querydsl-jpa:5.1.0:jakarta'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    annotationProcessor 'com.querydsl:querydsl-apt:5.1.0:jakarta'
    annotationProcessor 'jakarta.annotation:jakarta.annotation-api'
    annotationProcessor 'jakarta.persistence:jakarta.persistence-api'

    // MyBatis (통계/집계 쿼리용) - Mapper 인터페이스/설정이 core에서 컴파일되므로 core에 둔다
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:3.0.4'
}

def querydslDir = layout.projectDirectory.dir('src/main/generated')

sourceSets {
    main.java.srcDirs += [querydslDir]
}

tasks.withType(JavaCompile).configureEach {
    options.generatedSourceOutputDirectory = querydslDir
}

clean {
    delete querydslDir
}