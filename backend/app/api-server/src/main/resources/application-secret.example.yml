spring:
  config:
    activate:
      on-profile: secret
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/sandbox-ecommerce?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:password}

jwt:
  # openssl rand -base64 32 결과(Base64 256bit 이상)를 콜론 뒤 기본값으로 넣는다
  secret: ${JWT_SECRET:CHANGE_ME_openssl_rand_base64_32}
