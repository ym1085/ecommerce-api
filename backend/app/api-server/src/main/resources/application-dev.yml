server:
  port: 8081
  shutdown: graceful

spring:
  application:
    name: farm-market-dev
  config:
    activate:
      on-profile: dev
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 10
      connection-timeout: 5000
      idle-timeout: 600000
      max-lifetime: 1800000
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      timeout: 2s
      connect-timeout: 1s
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: false
        show_sql: false
        generate_statistics: false
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
        type:
          preferred_enum_jdbc_type: VARCHAR # enum 컬럼을 네이티브 enum 대신 VARCHAR로 매핑

farm-market:
  image:
    storage-location: file:/data/uploads/
    base-url: https://dev.farmmarket.com/images

logging:
  level:
    root: warn
    com.farmmarket: info
    org.springframework: warn
    org.hibernate.SQL: warn
